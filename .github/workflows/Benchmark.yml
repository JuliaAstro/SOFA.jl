name: Benchmark
on:
  pull_request:
    branches: [main]

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# Needed to post/update the benchmark results comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # benchpkg clones the base repo directly, where fork head SHAs are not
    # reachable (and fork PRs only get a read-only token, so the results
    # comment could not be posted either); skip fork PRs instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: "1"
          # Take the suite from the PR checkout; the default freezes the
          # script at main, which fails until the suite is merged there.
          script: "benchmark/benchmarks.jl"

      # The action above leaves the PR head checked out and Julia on PATH;
      # reuse both for a fresh pyerfa comparison run on this PR.
      - name: Cache CondaPkg environment
        uses: actions/cache@v4
        with:
          path: benchmark/pyerfa/.CondaPkg
          key: ${{ runner.os }}-condapkg-${{ hashFiles('benchmark/pyerfa/CondaPkg.toml') }}

      - name: Run pyerfa comparison
        run: |
          julia -t 1 --project=benchmark/pyerfa -e 'using Pkg; Pkg.instantiate()'
          julia -t 1 --project=benchmark/pyerfa benchmark/pyerfa/compare.jl
          julia benchmark/pyerfa/comment.jl > pyerfa-comment.md
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Find pyerfa comment
        uses: peter-evans/find-comment@v4
        id: find-pyerfa
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "SOFA.jl vs pyerfa"

      - name: Create or update pyerfa comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-pyerfa.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pyerfa-comment.md
          edit-mode: replace
